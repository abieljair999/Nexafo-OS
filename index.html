<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexafo OS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #0b1020, #182848);
      color: white;
    }

    /* Escritorio */
    .desktop {
      min-height: 100vh;
      padding: 25px;
      position: relative;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .time {
      font-size: 16px;
      opacity: 0.8;
    }

    /* Aplicaciones */
    .apps {
      display: grid;
      grid-template-columns: repeat(4, 90px);
      gap: 25px;
      margin-top: 50px;
    }

    .app {
      width: 90px;
      height: 100px;
      border: none;
      border-radius: 18px;
      background: rgba(255,255,255,0.1);
      color: white;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
    }

    .app:hover {
      transform: translateY(-5px);
      background: rgba(255,255,255,0.18);
    }

    .icon {
      font-size: 32px;
    }

    .app span:last-child {
      font-size: 13px;
    }

    /* Asistente */
    .assistant {
      position: absolute;
      right: 25px;
      bottom: 90px;
      width: 320px;
      background: rgba(10,15,30,0.92);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 20px;
      display: none;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }

    .assistant h2 {
      margin-bottom: 10px;
    }

    .assistant p {
      opacity: 0.8;
      margin-bottom: 15px;
    }

    .assistant input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      margin-bottom: 10px;
    }

    .assistant button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Barra inferior */
    .dock {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      padding: 10px 15px;
      border-radius: 20px;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(15px);
    }

    .dock button {
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 15px;
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 22px;
      cursor: pointer;
    }

    .dock button:hover {
      background: rgba(255,255,255,0.2);
    }

    /* Mensaje */
    .message {
      margin-top: 35px;
      max-width: 600px;
    }

    .message h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .message p {
      font-size: 18px;
      opacity: 0.7;
    }

    @media (max-width: 600px) {
      .apps {
        grid-template-columns: repeat(3, 80px);
        gap: 15px;
      }

      .app {
        width: 80px;
      }

      .assistant {
        left: 15px;
        right: 15px;
        width: auto;
      }

      .message h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <main class="desktop">

    <div class="top">
      <div class="logo">NEXAFO</div>
      <div class="time" id="time">00:00</div>
    </div>

    <section class="message">
      <h1>Bienvenido a Nexafo OS</h1>
      <p>Tu espacio digital. Inteligente, adaptable y diseñado para ti.</p>
    </section>

    <section class="apps">

      <button class="app" onclick="openAssistant()">
        <span class="icon">◉</span>
        <span>Nexafo AI</span>
      </button>

      <button class="app" onclick="showMessage('Archivos')">
        <span class="icon">□</span>
        <span>Archivos</span>
      </button>

      <button class="app" onclick="showMessage('Navegador')">
        <span class="icon">◌</span>
        <span>Navegador</span>
      </button>

      <button class="app" onclick="showMessage('Configuración')">
        <span class="icon">⚙</span>
        <span>Ajustes</span>
      </button>

    </section>

    <div class="assistant" id="assistant">
      <h2>Nexafo AI</h2>
      <p>Asistente inteligente de Nexafo OS.</p>

      <input
        id="question"
        type="text"
        placeholder="Escribe algo..."
      >

      <button onclick="askAI()">Enviar</button>

      <p id="answer"></p>
    </div>

    <nav class="dock">
      <button onclick="openAssistant()">◉</button>
      <button onclick="showMessage('Inicio')">⌂</button>
      <button onclick="showMessage('Configuración')">⚙</button>
    </nav>

  </main>

  <script>

    // Reloj
    function updateTime() {
      const now = new Date();

      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");

      document.getElementById("time").textContent =
        hours + ":" + minutes;
    }

    setInterval(updateTime, 1000);
    updateTime();


    // Abrir asistente
    function openAssistant() {
      const assistant = document.getElementById("assistant");

      if (assistant.style.display === "block") {
        assistant.style.display = "none";
      } else {
        assistant.style.display = "block";
      }
    }


    // Aplicaciones
    function showMessage(app) {
      alert(app + " estará disponible en una próxima versión de Nexafo OS.");
    }


    // Asistente básico
    function askAI() {

      const question =
        document.getElementById("question").value.trim();

      const answer =
        document.getElementById("answer");

      if (question === "") {
        answer.textContent = "Escribe algo primero.";
        return;
      }

      answer.textContent =
        "Nexafo AI recibió tu mensaje: " + question;
    }

  </script>

</body>
  </html>
